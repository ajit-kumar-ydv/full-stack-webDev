<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Hello bro</h1>
  <form action="" id="form">
    <div>
      <label for="username">Name:</label>
      <input type="text" id="username" placeholder="Enter your name">
      <span class="error-message" style="color: brown;"></span>
    </div>
    <div>
      <label for="email">Email: </label>
      <input type="email" id="email" placeholder="Enter your email">
      <span class="error-message" style="color: brown;"></span>
    </div>
    <div>
      <label for="password">Password: </label>
      <input type="password" id="password" placeholder="Enter your password">
      <span class="error-message" style="color: brown;"></span>
    </div>
    <p id="password-hint" class="hidden">Must be atleast 8 characters long</p>
    <div>
      <label for="bio">Bio: </label>
      <textarea name="bio" id="bio" placeholder="Enter your bio..."></textarea>
      <p id="char-count"></p>
      <span class="error-message" style="color: brown;"></span>
    </div>
    <div>
      <label for="country">Select your country: </label>
      <select name="country" id="country">
        <option value="india">India</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
      </select>
      <span class="error-message" style="color: brown;"></span>
    </div>
    <div>
      <input type="checkbox" id="checkbox">
      <label for="checkbox">I agree to the terms and conditions.</label>
    </div>



    <button id="btn" type="submit">Create Account</button>
  </form>

  <h2 class="hidden">Account created successfully!</h2>
  

  <script src="index.js"></script>
</body>
</html>
