<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move box with cursor</title>
  <style>
    #main{
      width: 100%;
      height: 100vh;
      background-color: #cb9a9a;
      overflow: hidden;
      position: relative;
    }
    #box{
      width: 200px;
      height: 200px;
      background-color: #085508;
      position: absolute;
      transition: cubic-bezier(0.19, 1, 0.22, 1) .5s;
    }
  </style>
</head>
<body>
  <div id="main">
    <div id="box"></div>
  </div>
  

  <script src="index.js"></script>
</body>
</html>
