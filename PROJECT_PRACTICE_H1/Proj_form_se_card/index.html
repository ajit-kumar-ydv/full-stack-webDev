<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Creation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    #container {
      margin: 50px;

    }

    input {
      display: block;
      margin: 3px;
      padding: 5px;

    }

    #card-container {
      margin: 30px;
      padding: 10px;
      border: 2px solid;
      display: flex;
      flex-wrap: wrap;

    }

    .card {
      border: 2px solid red;
      padding: 5px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      max-width: 200px;
    }

    .profile-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <div id="container">
    <form action="">
      <input type="text" placeholder="Enter photo link">
      <input type="text" placeholder="Enter name">
      <input type="text" placeholder="Profession">
      <input type="text" placeholder="Some Information">
      <input type="submit">
    </form>

    <div id="card-container">
      <div class="card">
        <div class="profile-img">
          <img src="PRESENT.png" alt="Profile pic">
        </div>
        <h3>AJIT KUMAR</h3>
        <h4>Developer</h4>

        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Deserunt, nostrum.</p>
      </div>
    </div>

  </div>
</body>

</html>
